<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单元诗词列表</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/unit.css">
</head>
<body class="page-unit">
    <!-- 标题栏 -->
    <header class="unit-header">
        <a href="index.html" class="unit-back-btn">返回首页</a>
        <h1 class="unit-title">单元诗词列表</h1>
        <a href="record.html" class="unit-record-link">学习记录入口</a>
    </header>
    <!-- 诗词卡片列表容器 -->
    <main class="unit-main">
        <!-- 单元快捷导航栏 -->
        <div class="unit-nav-bar">
            <a href="unit.html?unit=unit1" class="unit-nav-btn">第一单元</a>
            <a href="unit.html?unit=unit3" class="unit-nav-btn">第三单元</a>
            <a href="unit.html?unit=recite" class="unit-nav-btn">古诗词诵读</a>
        </div>

        <div class="poem-list">
            <!-- 诗词卡片 -->
        </div>
    </main>

    <!-- 通用AI悬浮按钮 -->
    <div class="ai-float-btn" id="aiFloatBtn">AI助教</div>

    <!-- 统一AI弹窗 -->
    <div class="ai-modal" id="aiModal">
        <div class="ai-modal-header">
            <span>AI 诗词助教</span>
            <button id="clearChatBtn">清空对话</button>
        </div>
        <div class="ai-chat-area" id="aiChatArea">
            <div class="welcome-message">你好！我是诗韵学堂的AI助教，有什么诗词问题都可以问我~</div>
        </div>
        <div class="ai-input-area">
            <input type="text" id="aiInput" placeholder="输入你的问题...">
            <button id="sendBtn">发送</button>
        </div>
    </div>

    <!-- AI 样式 -->
    <style>
    .ai-float-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        z-index: 999;
        font-size: 16px;
    }

    .ai-modal {
        position: fixed;
        bottom: 120px;
        right: 24px;
        width: 400px;
        max-width: 90vw;
        height: 550px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        display: none;
        flex-direction: column;
        z-index: 1000;
        overflow: hidden;
    }

    .ai-modal-header {
        padding: 16px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
    }

    #clearChatBtn {
        background: #f0f0f0;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
    }

    .ai-chat-area {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        background: #fafafa;
    }

    .welcome-message {
        color: #666;
        margin-bottom: 16px;
    }

    .user-bubble, .ai-bubble {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 12px;
        margin-bottom: 12px;
        line-height: 1.5;
    }

    .user-bubble {
        background: #667eea;
        color: white;
        margin-left: auto;
    }

    .ai-bubble {
        background: white;
        border: 1px solid #eee;
        margin-right: auto;
    }

    .ai-input-area {
        display: flex;
        padding: 12px;
        border-top: 1px solid #eee;
    }

    #aiInput {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
    }

    #sendBtn {
        margin-left: 8px;
        padding: 10px 20px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }
    </style>

    <!-- 引入公共AI脚本 -->
    <script src="main.js"></script>

    <!-- 单元页专属：渲染诗词卡片 -->
    <script>
    const unitData = {
        unit1: [
            { title: "寒食", author: "韩翃", poemId: "han-shi", content:"春城无处不飞花，寒食东风御柳斜。\n日暮汉宫传蜡烛，轻烟散入五侯家。" },
            { title: "迢迢牵牛星", author: "佚名", poemId: "tiao-tiao-qian-niu-xing", content:"迢迢牵牛星，皎皎河汉女。\n纤纤擢素手，札札弄机杼。\n终日不成章，泣涕零如雨。\n河汉清且浅，相去复几许。\n盈盈一水间，脉脉不得语。" },
            { title: "十五夜望月", author: "王建", poemId: "shi-wu-ye-wang-yue", content:"中庭地白树栖鸦，冷露无声湿桂花。\n今夜月明人尽望，不知秋思落谁家。" }
        ],
        unit3: [
            { title: "马诗", author: "李贺", poemId: "ma-shi", content:"大漠沙如雪，燕山月似钩。\n何当金络脑，快走踏清秋。" },
            { title: "石灰吟", author: "于谦", poemId: "shi-hui-yin", content:"千锤万凿出深山，烈火焚烧若等闲。\n粉骨碎身浑不怕，要留清白在人间。" },
            { title: "竹石", author: "郑燮", poemId: "zhu-shi", content:"咬定青山不放松，立根原在破岩中。\n千磨万击还坚劲，任尔东西南北风。" }
        ],
        recite: [
            { title: "采薇（节选）", author: "佚名", poemId: "cai-wei", content:"昔我往矣，杨柳依依。\n今我来思，雨雪霏霏。\n行道迟迟，载渴载饥。\n我心伤悲，莫知我哀！" },
            { title: "送元二使安西", author: "王维", poemId: "song-yuan-er-shi-an-xi", content:"渭城朝雨浥轻尘，客舍青青柳色新。\n劝君更尽一杯酒，西出阳关无故人。" },
            { title: "春夜喜雨", author: "杜甫", poemId: "chun-ye-xi-yu", content:"好雨知时节，当春乃发生。\n随风潜入夜，润物细无声。\n野径云俱黑，江船火独明。\n晓看红湿处，花重锦官城。" },
            { title: "早春呈水部张十八员外", author: "韩愈", poemId: "zao-chun-cheng-shui-ba-shi-ba-wai-yuan", content:"天街小雨润如酥，草色遥看近却无。\n最是一年春好处，绝胜烟柳满皇都。" },
            { title: "江上渔者", author: "范仲淹", poemId: "jiang-shang-yu-zhe", content:"江上往来人，但爱鲈鱼美。\n君看一叶舟，出没风波里。" },
            { title: "泊船瓜洲", author: "王安石", poemId: "bo-chuan-gua-zhou", content:"京口瓜洲一水间，钟山只隔数重山。\n春风又绿江南岸，明月何时照我还。" },
            { title: "游园不值", author: "叶绍翁", poemId: "you-yuan-bu-zhi", content:"应怜屐齿印苍苔，小扣柴扉久不开。\n春色满园关不住，一枝红杏出墙来。" },
            { title: "卜算子·送鲍浩然之浙东", author: "王观", poemId: "bo-suan-zi-song-bao-hao-ran-zhi-zhe-dong", content:"水是眼波横，山是眉峰聚。\n欲问行人去那边？眉眼盈盈处。\n才始送春归，又送君归去。\n若到江南赶上春，千万和春住。" },
            { title: "浣溪沙", author: "苏轼", poemId: "huan-xi-sha", content:"游蕲水清泉寺，寺临兰溪，溪水西流。\n山下兰芽短浸溪，松间沙路净无泥。\n萧萧暮雨子规啼。\n谁道人生无再少？门前流水尚能西！\n休将白发唱黄鸡。" },
            { title: "清平乐", author: "黄庭坚", poemId: "qing-ping-le", content:"春归何处？寂寞无行路。\n若有人知春去处，唤取归来同住。\n春无踪迹谁知？除非问取黄鹂。\n百啭无人能解，因风飞过蔷薇。" }
        ]
    };


    function renderPoemList(unitKey) {
        const poems = unitData[unitKey];
        const listEl = document.querySelector(".poem-list");
        const titleEl = document.querySelector(".unit-title");

        const unitNames = {
            unit1: "第一单元",
            unit3: "第三单元",
            recite: "古诗词诵读"
        };
        titleEl.textContent = `${unitNames[unitKey]} 诗词列表`;
        listEl.innerHTML = "";

        listEl.classList.remove("layout-3col", "layout-5col");
        if(unitKey === "recite"){
            listEl.classList.add("layout-5col");
        }else{
            listEl.classList.add("layout-3col");
        }

        poems.forEach(poem => {
            const card = document.createElement("div");
            card.className = "poem-card";
            card.innerHTML = `
                <div class="poem-cover"></div>
                <h3 class="poem-title">${poem.title}</h3>
                <p class="poem-author">${poem.author}</p>
                <p class="poem-preview">${poem.content}</p>
                <a href="poem-detail.html?id=${poem.poemId}" class="poem-btn">进入学习</a>
            `;
            listEl.appendChild(card);
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const unit = params.get("unit");
        if (unit && unitData[unit]) {
            renderPoemList(unit);
        }
    });
    </script>
</body>
</html>
