<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>学习记录 - 诗韵学堂</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "SimSun", serif;
    }
    body {
      background: #f6f2e9;
      padding: 32px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 32px;
    }
    .progress-wrap {
      background: #fffbf5;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px #00000010;
      margin-bottom: 24px;
    }
    .total-progress-bar {
      height: 24px;
      background: #eee;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .total-progress-inner {
      height: 100%;
      background: #82b4c8;
      width: 0%;
      transition: width 0.3s;
    }
    .unit-item {
      padding: 16px;
      background: #f9f6f0;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
    }
    .error-wrap {
      background: #fffbf5;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px #00000010;
    }
    .error-item {
      padding: 12px;
      border-bottom: 1px solid #e9e4da;
    }
    .empty-tip {
      text-align: center;
      color: #888;
      padding: 20px;
    }
    .back-btn {
      margin-top: 24px;
      display: block;
      width: fit-content;
      margin-left: auto;
      padding: 10px 20px;
      background: #a1c9d8;
      border: none;
      border-radius: 8px;
      color: #222;
      font-size:16px;
      cursor: pointer;
    }
    .hide { display: none; }
  </style>
</head>
<body>
<div class="container">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <h1>学习记录</h1>
    <button id="resetBtn" style="padding:8px 14px;background:#e76f51;color:#fff;border:none;border-radius:8px;cursor:pointer;">重置全部记录</button>
  </div>

  <div class="progress-wrap">
    <div class="total-progress-bar">
      <div class="total-progress-inner" id="totalBar"></div>
    </div>
    <div id="unitList"></div>
  </div>

  <div class="error-wrap">
    <h2>错题汇总列表</h2>
    <div id="errorListBox"></div>
  </div>

  <button class="back-btn" onclick="history.back()">返回首页</button>
</div>

<script>
        // 初始化数据，如果sessionStorage没有，则新建
        function getSessionData(){
        const raw = sessionStorage.getItem("poemRecord");
        if(raw){
            return JSON.parse(raw);
        }
        // 默认初始数据
        return {
            units: [
            { name: "第一单元", learned: 0, total: 3 },
            { name: "第三单元", learned: 0, total: 3 },
            { name: "古诗词诵读", learned: 0, total: 10 }
            ],
            errorList: []
        }
        }
        function saveSessionData(data){
            sessionStorage.setItem("poemRecord", JSON.stringify(data));
        }

        // 计算总进度
        function calcTotalProgress(data) {
            const allTotal = data.units.reduce((sum, item) => sum + item.total, 0);
            const allLearned = data.units.reduce((sum, item) => sum + item.learned, 0);
            return { allLearned, allTotal };
        }

        // 渲染页面
        function renderPage() {
            const data = getSessionData();
            const { allLearned, allTotal } = calcTotalProgress(data);
            const percent = allTotal === 0 ? 0 : (allLearned / allTotal * 100);
            document.getElementById("totalBar").style.width = `${percent}%`;

            // 渲染单元列表
            const unitDom = data.units.map(u => `
                <div class="unit-item">
                <span>${u.name}</span>
                <span>${u.learned}/${u.total}</span>
                </div>
            `).join('');
            document.getElementById("unitList").innerHTML = unitDom;

            // 渲染错题
            if(data.errorList.length === 0){
                document.getElementById("errorListBox").innerHTML = `<div class="empty-tip">暂无错题</div>`;
            }else{
                const errorDom = data.errorList.map((item, idx)=>`
                    <div class="error-item">
                        <div onclick="this.nextElementSibling.classList.toggle('hide')">${idx+1}. ${item.title}</div>
                        <div class="hide" style="color:#276749;margin:4px 0 8px 1em">✅正确答案：${item.answer}</div>
                    </div>
                `).join('');
                document.getElementById("errorListBox").innerHTML = errorDom;
            }
        }

        renderPage();
        
        // 重置记录按钮
        document.getElementById("resetBtn").addEventListener('click', function(){
            if(confirm("确定清空所有学习进度和错题记录吗？此操作不可撤销！")){
                // 删除存储数据，恢复默认
                sessionStorage.removeItem("poemRecord");
                renderPage(); // 重新渲染页面
            }
        })
</script>
</body>
</html>
